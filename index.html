            <option value="female"> Female</option>
        </select>
        <br>
    </fieldset>
    <br>
    <br>

        <input type="text" id="city" placeholder="enter your city"><br><br>

        <input type="text" id="country" placeholder="enter your country"><br>
        
    </fieldset>
